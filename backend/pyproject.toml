[project]
name = "backend"
version = "0.1.0"
description = "Backend do Sugestão da Casa"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.42.0",
    "pydantic-settings>=2.16.2",
    "supabase>=2.33.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integracao: precisa de um Supabase acessível (SUPABASE_URL e SUPABASE_ANON_KEY)",
]
pythonpath = ["."]
